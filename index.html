<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RCWD Jersey 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Teko:wght@500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root {
    --bg: #eef5f1;
    --surface: #ffffff;
    --ink: #12332b;
    --muted: #5b776d;
    --line: #d3e3da;
    --accent: #2f8f6b;
    --accent-ink: #ffffff;
    --accent-soft: #dcefe6;
    --danger: #b4413a;
    --danger-soft: #f8e1de;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1a16;
      --surface: #15261f;
      --ink: #e4f1ea;
      --muted: #9cb8ac;
      --line: #27443a;
      --accent: #5cc9a0;
      --accent-ink: #0e1a16;
      --accent-soft: #1c3a30;
      --danger: #f08a80;
      --danger-soft: #3a1e1b;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.55 'Prompt', system-ui, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }

  .num { font-family: 'Teko', 'Prompt', sans-serif; font-weight: 600; letter-spacing: 0.02em; line-height: 1; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  @media (min-width: 720px) { .wrap { padding: 40px 32px 64px; } }

  /* ---------- wordmark ---------- */
  .mark { display: flex; align-items: baseline; gap: 10px; margin: 0; }
  .mark .num { font-size: 44px; color: var(--accent); }
  .mark span:last-child { font-size: 18px; font-weight: 600; }
  .mark small { display: block; font-size: 14px; font-weight: 400; color: var(--muted); }

  /* ---------- login ---------- */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login form {
    width: 100%; max-width: 360px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px 24px 24px;
  }
  .login .mark { margin-bottom: 4px; }
  .login p.lead { margin: 0 0 22px; color: var(--muted); font-size: 15px; }
  .nowrap { white-space: nowrap; }
  .field { display: block; margin-bottom: 14px; }
  .field span { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink);
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn[disabled] { opacity: 0.6; cursor: progress; }
  .login .btn.primary { width: 100%; margin-top: 6px; padding: 12px 16px; }
  .error { color: var(--danger); font-size: 14px; margin: 12px 0 0; min-height: 1.4em; }
  .setup-note { margin: 18px 0 0; font-size: 14px; color: var(--muted); }

  /* ---------- dashboard header ---------- */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* category switch: the two big choices */
  .switch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
  @media (min-width: 720px) { .switch { grid-template-columns: repeat(auto-fill, 220px); } }
  .switch button {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; text-align: left;
  }
  .switch .label { display: inline-flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; }
  .swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line); flex: none; }
  .swatch.green { background: #1f7a55; border-color: #1f7a55; }
  .swatch.white { background: #ffffff; border-color: #b9c9c0; }
  .switch button .num { font-size: 34px; color: var(--muted); }
  .switch button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .switch button[aria-pressed="true"] .num { color: var(--accent); }

  /* filters */
  .filters {
    display: grid; gap: 12px; align-items: end;
    grid-template-columns: 1fr 1fr;
    margin-bottom: 18px;
  }
  .filters > * { min-width: 0; }
  .filters .field { margin: 0; }
  .filters input { min-width: 0; max-width: 100%; }
  .filters .search { grid-column: 1 / -1; }
  .filters .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
  @media (min-width: 860px) {
    .filters { grid-template-columns: 170px 170px 1fr auto; }
    .filters .search { grid-column: auto; }
    .filters .actions { grid-column: auto; }
  }
  .filters input { padding: 9px 10px; background: var(--surface); }

  /* panel with size run + list */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

  .run { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .run div { flex: 1 1 72px; padding: 14px 18px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: -1px; }
  .run div:last-child { border-right: 0; background: var(--accent-soft); }
  .run dt { font-size: 13px; color: var(--muted); font-weight: 500; }
  .run dd { margin: 4px 0 0; font-size: 34px; }
  .run div.zero dd { color: var(--muted); opacity: 0.55; }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th {
    text-align: left; font-size: 13px; font-weight: 500; color: var(--muted);
    padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.idx { color: var(--muted); width: 1%; white-space: nowrap; }
  td.when { color: var(--muted); white-space: nowrap; font-size: 14px; }
  td.size span {
    display: inline-block; min-width: 44px; text-align: center;
    padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; font-weight: 600; font-size: 14px;
  }
  /* the back of the jersey: name over a big number */
  td.back-name { font-weight: 600; letter-spacing: 0.06em; }
  td.back-number .num { font-size: 30px; display: inline-block; min-width: 2ch; }
  td.flag { color: var(--danger); }
  td.flag .hint { display: block; font-size: 12px; font-weight: 400; letter-spacing: 0; }
  td.wrapcell { min-width: 140px; }
  /* ออเดอร์ #8-1 = ลำดับ 8 ในแท็บตรวจสลิป เสื้อตัวที่ 1 */
  td.order { color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.order .manual {
    display: inline-block; padding: 1px 8px; font-size: 12px;
    border: 1px dashed var(--line); border-radius: 999px;
  }
  td.nowrap { white-space: nowrap; }
  td.qty .num { font-size: 26px; }

  /* จัดส่ง: ชื่อผู้รับ + เบอร์, ที่อยู่กับรายการตัดบรรทัด */
  td.who { min-width: 150px; }
  td.who strong { font-weight: 600; display: block; }
  .sub { display: block; color: var(--muted); font-size: 13px; white-space: pre-line; }
  td.who a { font-size: 14px; }
  td.addr { min-width: 220px; max-width: 340px; white-space: pre-line; }
  td.items { min-width: 200px; white-space: pre-line; font-size: 14px; }
  td.buyer { min-width: 130px; white-space: pre-line; font-size: 14px; }
  /* มือถือ: จัดส่งเป็นการ์ดทีละออเดอร์ ไม่ต้องเลื่อนตารางไปข้าง */
  @media (max-width: 720px) {
    table.ship thead { display: none; }
    table.ship, table.ship tbody, table.ship tr, table.ship td { display: block; width: 100%; }
    table.ship tr { padding: 12px 16px; border-bottom: 1px solid var(--line); }
    table.ship tr:last-child { border-bottom: 0; }
    table.ship td { border: 0; padding: 3px 0; min-width: 0; max-width: none; white-space: normal; }
    table.ship td.addr, table.ship td.items, table.ship td.buyer { white-space: pre-line; }
    table.ship td[data-label]::before {
      content: attr(data-label); display: block; font-size: 12px; font-weight: 500; color: var(--muted);
    }
    table.ship td.idx { display: none; }
    table.ship td.who strong { font-size: 17px; }
  }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); white-space: nowrap;
  }
  .badge.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .badge.wait { color: var(--muted); }
  .track { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .copy {
    margin-top: 6px; padding: 2px 8px; font-size: 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--accent);
  }

  @media (max-width: 600px) {
    th, td { padding: 8px 10px; }
    td.back-number .num { font-size: 26px; }
    .run div { padding: 12px 12px 10px; }
  }

  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .empty .btn { margin-top: 12px; }

  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; margin-top: 14px; font-size: 14px; color: var(--muted); }
  .foot button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; }

  .loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }

  @media (prefers-reduced-motion: no-preference) {
    .switch button, .btn { transition: border-color 0.15s, background-color 0.15s; }
  }
</style>
</head>
<body>

<div class="loading" id="loading">กำลังโหลด…</div>

<main class="login" id="login" hidden>
  <form id="login-form" autocomplete="on">
    <h1 class="mark"><span class="num">RCWD</span><span>Jersey 2026</span></h1>
    <p class="lead">รายการสั่งเสื้อและหมวกของราชาวดี <span class="nowrap">สำหรับทีมงาน</span></p>
    <label class="field">
      <span>ชื่อผู้ใช้</span>
      <input name="username" autocomplete="username" required autocapitalize="off" spellcheck="false">
    </label>
    <label class="field">
      <span>รหัสผ่าน</span>
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary" type="submit">เข้าสู่ระบบ</button>
    <p class="error" id="login-error" role="alert"></p>
    <p class="setup-note" id="setup-note" hidden>
      หน้านี้ยังไม่ได้เชื่อมกับ Google Sheet ใส่ลิงก์ Web app ของ Apps Script ใน config.js ก่อน
      หรือ <a href="?demo">ดูตัวอย่างด้วยข้อมูลสมมติ</a>
    </p>
  </form>
</main>

<div class="wrap" id="app" hidden>
  <header class="top">
    <h1 class="mark">
      <span class="num">RCWD</span>
      <span>Jersey 2026<small id="subtitle">รายการที่สลิปผ่านแล้ว</small></span>
    </h1>
    <div class="top-actions">
      <a class="btn" id="sheet-link" target="_blank" rel="noopener" hidden>เปิด Google Sheet</a>
      <button class="btn" id="logout" type="button">ออกจากระบบ</button>
    </div>
  </header>

  <div class="switch" id="switch" role="group" aria-label="เลือกหมวด"></div>

  <div class="filters">
    <label class="field"><span>ตั้งแต่วันที่</span><input type="date" id="from"></label>
    <label class="field"><span>ถึงวันที่</span><input type="date" id="to"></label>
    <label class="field search"><span>ค้นหา</span><input type="search" id="q" placeholder="ชื่อหลังเสื้อ หรือเลข"></label>
    <div class="actions">
      <button class="btn" type="button" id="clear-dates" hidden>ล้างวันที่</button>
      <button class="btn primary" type="button" id="export">ดาวน์โหลด Excel</button>
    </div>
  </div>

  <section class="panel" aria-live="polite">
    <dl class="run" id="run"></dl>
    <div class="table-scroll">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>
      <p id="empty-text">ยังไม่มีออเดอร์</p>
      <button class="btn" type="button" id="empty-reset" hidden>ดูทุกวันที่</button>
    </div>
  </section>

  <footer class="foot">
    <span id="updated"></span>
    <button type="button" id="refresh">ดึงข้อมูลล่าสุด</button>
  </footer>
</div>

<script>
(() => {
  const API_URL = String(window.RCWD_API_URL || '').trim();
  const DEMO = new URLSearchParams(location.search).has('demo');
  const AUTH_KEY = 'rcwd-auth';
  const XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

  const state = { data: null, view: '', from: '', to: '', q: '' };
  const $ = id => document.getElementById(id);

  // ---------- helpers ----------
  const tz = 'Asia/Bangkok';
  const dayKeyFmt = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' });
  const shortFmt = new Intl.DateTimeFormat('th-TH-u-ca-gregory', { timeZone: tz, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const fullFmt = new Intl.DateTimeFormat('en-GB', { timeZone: tz, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const timeFmt = new Intl.DateTimeFormat('th-TH-u-ca-gregory', { timeZone: tz, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const toDate = iso => { const t = new Date(iso); return iso && !isNaN(t) ? t : null; };
  const dayKey = iso => { const t = toDate(iso); return t ? dayKeyFmt.format(t) : ''; };
  const shortDate = iso => { const t = toDate(iso); return t ? shortFmt.format(t) : '-'; };

  function el(tag, props, children) {
    const node = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v === undefined || v === null) continue;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else node.setAttribute(k, v);
      }
    }
    (children || []).forEach(c => { if (c !== null && c !== undefined) node.append(c); });
    return node;
  }

  const safeLink = url => /^https:\/\/(drive|docs)\.google\.com\//.test(String(url || '')) ? url : '';
  const badName = n => String(n || '').length > 8;
  const badNumber = n => !/^\d{1,3}$/.test(String(n || ''));

  // ---------- data ----------
  async function fetchData(username, password) {
    if (DEMO) return demoData();
    if (!API_URL) throw Object.assign(new Error('หน้านี้ยังไม่ได้เชื่อมกับ Google Sheet'), { setup: true });
    let res;
    try {
      res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ username, password }) });
    } catch (e) {
      throw new Error('เชื่อมต่อไม่ได้ เช็กอินเทอร์เน็ตแล้วลองใหม่');
    }
    if (!res.ok) throw new Error('Google Sheet ตอบกลับผิดพลาด (HTTP ' + res.status + ')');
    let json;
    try { json = await res.json(); } catch (e) { throw new Error('ข้อมูลที่ได้กลับมาอ่านไม่ได้ ลองใหม่อีกครั้ง'); }
    if (!json.ok) throw Object.assign(new Error(json.error || 'ดึงข้อมูลไม่สำเร็จ'), { auth: true });
    return json;
  }

  function demoData() {
    const names = ['TEST', 'DEMO', 'SAMPLE', 'RCWD', 'GREEN', 'HOUSE', 'TEAM', 'CHEER', 'DRUM', 'FLAG', 'STAND', 'PARADE', 'VERYLONGNAME', 'BLUE'];
    const sizes = ['M', 'L', 'S', 'XL', 'M', '2XL', 'L', 'M', 'S', 'M', '3XL', 'L', 'M', 'XL'];
    const day = d => new Date(Date.UTC(2026, 9, d, 4 + (d % 5), 10 + d)).toISOString();
    const shirts = names.map((n, i) => ({
      order: '#' + (i + 1) + '-1', time: day(3 + (i % 5)), color: i % 3 === 0 ? 'ขาว' : 'เขียว', size: sizes[i], name: n,
      number: i === 5 ? '1234' : String((i * 7) % 99).padStart(i % 4 === 0 ? 2 : 1, '0'), piece: 1, slip: '',
    }));
    shirts.push({ order: '', time: '', color: 'เขียว', size: 'M', name: 'STAFF', number: '0', slip: '' });
    const caps = ['ตัวอย่าง หนึ่ง', 'ตัวอย่าง สอง', 'ตัวอย่าง สาม', 'ตัวอย่าง สี่', 'ตัวอย่าง ห้า'].map((n, i) => ({
      order: '#' + (20 + i), time: day(4 + i % 4), name: n, grade: 'ม.' + (i + 1), room: String(i + 2), phone: '0800000' + String(100 + i),
      social: '@demo' + (i + 1), product: i % 2 ? 'หมวก RCWD' : 'RCWD Jersey + หมวก RCWD', qty: i === 1 ? 3 : i === 3 ? 2 : 1, slip: '',
    }));
    const shipping = [
      { order: '#2', time: day(3), name: 'ผู้รับ ตัวอย่าง', phone: '0811111111', address: '99/1 ถ.ตัวอย่าง แขวงสามเสนใน เขตพญาไท กรุงเทพฯ 10400',
        items: 'Jersey เขียว · L · DEMO · 7', buyer: 'ตัวอย่าง สอง\nม.5 ห้อง 2', contact: '0800000101\n@demo2', shipped: true, tracking: 'TH0000000001', slip: '' },
      { order: '#21', time: day(5), name: 'ผู้ปกครอง ตัวอย่าง', phone: '0822222222', address: '12 หมู่ 3 ต.ตัวอย่าง อ.ตัวอย่าง นนทบุรี 11120',
        items: 'หมวก RCWD 3 ใบ', buyer: 'ตัวอย่าง สอง\nม.2 ห้อง 3', contact: '0800000101\n@demo2', shipped: false, tracking: '', slip: '' },
      { order: '#9', time: day(6), name: 'ป้า ตัวอย่าง', phone: '0833333333', address: 'คอนโดตัวอย่าง ห้อง 1201\nซอยตัวอย่าง 3',
        items: 'Jersey ขาว · M · FLAG · 63\nJersey เขียว · M · STAND · 70\nหมวก RCWD 1 ใบ', buyer: 'ตัวอย่าง สาม\nม.3 ห้อง 4', contact: '0800000102\n@demo3', shipped: false, tracking: '', slip: '' },
    ];
    return Promise.resolve({ ok: true, demo: true, updatedAt: new Date().toISOString(), sheetUrl: '', onlyVerified: true,
      sizes: ['S', 'M', 'L', 'XL', '2XL', '3XL'], colors: ['เขียว', 'ขาว'], capLabel: 'หมวก RCWD', shipLabel: 'จัดส่ง', shirts, caps, shipping });
  }

  // ---------- views ----------
  function show(view) {
    $('loading').hidden = view !== 'loading';
    $('login').hidden = view !== 'login';
    $('app').hidden = view !== 'app';
  }

  // หมวด: เสื้อแยกตามสี (Jersey เขียว, Jersey ขาว, ...) + หมวก + จัดส่ง (ถ้าสคริปต์ส่งมา)
  const SWATCH = { 'เขียว': 'green', 'ขาว': 'white' };
  function viewList(d) {
    const colors = Array.isArray(d.colors) && d.colors.length ? d.colors : [null];
    const list = colors.map(c => ({
      key: 'shirt:' + (c || ''), kind: 'shirt', color: c,
      label: c ? 'Jersey ' + c : 'เสื้อ', swatch: SWATCH[c] || '',
    }));
    list.push({ key: 'caps', kind: 'cap', label: d.capLabel || 'หมวก' });
    if (Array.isArray(d.shipping)) list.push({ key: 'ship', kind: 'ship', label: d.shipLabel || 'จัดส่ง' });
    return list;
  }
  function currentView() {
    const views = viewList(state.data);
    return views.find(v => v.key === state.view) || views[0];
  }
  function rowsOf(view, onlyInRange) {
    const base = view.kind === 'cap' ? state.data.caps
      : view.kind === 'ship' ? state.data.shipping
      : state.data.shirts.filter(r => view.color === null || r.color === view.color);
    return onlyInRange ? base.filter(inRange) : base;
  }
  // หมวกนับเป็นใบ (ออเดอร์หนึ่งสั่งได้หลายใบ) ที่เหลือนับแถว
  const qtyOf = r => Math.max(1, Number(r.qty) || 1);
  const countOf = (view, rows) => (view.kind === 'cap' ? rows.reduce((t, r) => t + qtyOf(r), 0) : rows.length);
  const UNIT = { shirt: 'ตัว', cap: 'ใบ', ship: 'ออเดอร์' };

  function inRange(row) {
    if (!state.from && !state.to) return true;
    const d = dayKey(row.time);
    if (!d) return false;
    return (!state.from || d >= state.from) && (!state.to || d <= state.to);
  }

  function matches(row) {
    if (!state.q) return true;
    const q = state.q.toLowerCase();
    if (/^#\d+$/.test(q)) {
      const o = String(row.order || '');
      return o === q || o.indexOf(q + '-') === 0;
    }
    const kind = currentView().kind;
    const hay = kind === 'shirt' ? [row.name, row.number, row.size, row.order]
      : kind === 'ship' ? [row.name, row.phone, row.address, row.items, row.buyer, row.contact, row.tracking, row.order]
      : [row.name, row.phone, row.social, row.grade, row.room, row.product, row.order];
    return hay.some(v => String(v || '').toLowerCase().includes(q));
  }

  function columnsFor(kind) {
    const order = state.withOrder ? ['ออเดอร์'] : [];
    if (kind === 'ship') return ['ลำดับ', 'ผู้รับ', 'ที่อยู่', 'รายการ', 'ผู้สั่ง'].concat(order, ['สถานะ', 'วันที่สั่ง', 'สลิป']);
    const main = kind === 'shirt'
      ? ['ลำดับ', 'Size', 'ชื่อหลังเสื้อ', 'เลขหลังเสื้อ']
      : ['ลำดับ', 'ชื่อ', 'ชั้น', 'ห้อง', 'เบอร์ติดต่อ', 'IG / Line', 'สินค้าที่สั่ง'].concat(state.withQty ? ['จำนวน'] : []);
    return main.concat(order, ['วันที่สั่ง', 'สลิป']);
  }

  // แถวที่ไม่มีเลขออเดอร์ = พิมพ์เพิ่มเองในชีต
  function orderCell(row) {
    if (!state.withOrder) return null;
    return row.order
      ? el('td', { class: 'order', text: row.order })
      : el('td', { class: 'order' }, [el('span', { class: 'manual', text: 'เพิ่มเอง', title: 'แถวที่พิมพ์เพิ่มเองในชีต' })]);
  }

  function slipCell(row) {
    const url = safeLink(row.slip);
    return el('td', { class: 'nowrap' }, [
      url ? el('a', { href: url, target: '_blank', rel: 'noopener', text: 'ดูสลิป', title: 'เปิดใน Google Drive (ต้องใช้บัญชีเจ้าของฟอร์ม)' })
          : el('span', { text: 'ไม่มีสลิป', style: 'color: var(--muted)' }),
    ]);
  }

  function shirtRow(row, i) {
    const nameBad = badName(row.name);
    const numberBad = badNumber(row.number);
    return el('tr', null, [
      el('td', { class: 'idx', text: String(i + 1) }),
      el('td', { class: 'size' }, [el('span', { text: row.size || '-' })]),
      el('td', { class: 'back-name' + (nameBad ? ' flag' : '') }, [
        row.name || '-',
        nameBad ? el('span', { class: 'hint', text: 'เกิน 8 ตัวอักษร' }) : null,
      ]),
      el('td', { class: 'back-number' + (numberBad ? ' flag' : '') }, [
        el('span', { class: 'num', text: row.number || '-' }),
        numberBad ? el('span', { class: 'hint', text: 'ต้องเป็นตัวเลข 1-3 หลัก' }) : null,
      ]),
      orderCell(row),
      el('td', { class: 'when', text: shortDate(row.time) }),
      slipCell(row),
    ]);
  }

  function capRow(row, i) {
    return el('tr', null, [
      el('td', { class: 'idx', text: String(i + 1) }),
      el('td', { class: 'wrapcell', text: row.name }),
      el('td', { class: 'nowrap', text: row.grade }),
      el('td', { text: row.room }),
      el('td', { class: 'nowrap', text: row.phone }),
      el('td', { text: row.social }),
      el('td', { class: 'wrapcell', text: row.product }),
      state.withQty ? el('td', { class: 'qty' }, [el('span', { class: 'num', text: String(qtyOf(row)) })]) : null,
      orderCell(row),
      el('td', { class: 'when', text: shortDate(row.time) }),
      slipCell(row),
    ]);
  }

  // เบอร์โทรกดโทรได้บนมือถือ
  function telLink(phone) {
    const digits = String(phone || '').replace(/[^\d+]/g, '');
    if (digits.length < 9) return phone ? el('span', { class: 'sub', text: phone }) : null;
    return el('a', { href: 'tel:' + digits, text: phone });
  }

  async function copyLabel(row, btn) {
    const text = [row.name, row.phone, row.address].filter(Boolean).join('\n');
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = 'คัดลอกแล้ว';
    } catch (e) {
      btn.textContent = 'คัดลอกไม่ได้';
    }
    setTimeout(() => { btn.textContent = 'คัดลอกชื่อ+ที่อยู่'; }, 1500);
  }

  function shipRow(row, i) {
    const copy = el('button', { type: 'button', class: 'copy', text: 'คัดลอกชื่อ+ที่อยู่', title: 'คัดลอกชื่อ เบอร์ และที่อยู่ ไปวางในใบจ่าหน้า' });
    copy.addEventListener('click', () => copyLabel(row, copy));
    const order = orderCell(row);
    if (order) order.setAttribute('data-label', 'ออเดอร์');
    const slip = slipCell(row);
    slip.setAttribute('data-label', 'สลิป');
    return el('tr', null, [
      el('td', { class: 'idx', text: String(i + 1) }),
      el('td', { class: 'who' }, [el('strong', { text: row.name || '-' }), telLink(row.phone)]),
      el('td', { class: 'addr', 'data-label': 'ที่อยู่' }, [row.address || '-', el('br'), copy]),
      el('td', { class: 'items', 'data-label': 'รายการ', text: row.items || '-' }),
      el('td', { class: 'buyer', 'data-label': 'ผู้สั่ง' }, [row.buyer || '-', row.contact ? el('span', { class: 'sub', text: row.contact }) : null]),
      order,
      el('td', { class: 'nowrap', 'data-label': 'สถานะ' }, [
        el('span', { class: 'badge ' + (row.shipped ? 'done' : 'wait'), text: row.shipped ? 'ส่งแล้ว' : 'รอส่ง' }),
        row.tracking ? el('span', { class: 'track', text: row.tracking }) : null,
      ]),
      el('td', { class: 'when', 'data-label': 'วันที่สั่ง', text: shortDate(row.time) }),
      slip,
    ]);
  }

  function runItem(label, value, extraClass) {
    return el('div', { class: (value === 0 ? 'zero ' : '') + (extraClass || '') }, [
      el('dt', { text: label }),
      el('dd', { class: 'num', text: String(value) }),
    ]);
  }

  function summary(rows, view) {
    if (view.kind === 'shirt') {
      const sizes = (state.data.sizes || []).slice();
      rows.forEach(r => { if (r.size && sizes.indexOf(r.size) === -1) sizes.push(r.size); });
      const items = sizes.map(s => [s, rows.filter(r => r.size === s).length]);
      return { items, total: ['รวม (ตัว)', rows.length] };
    }
    if (view.kind === 'ship') {
      const done = rows.filter(r => r.shipped).length;
      return { items: [['รอส่ง', rows.length - done], ['ส่งแล้ว', done]], total: ['รวม (ออเดอร์)', rows.length] };
    }
    const withShirt = rows.filter(r => /jersey|เสื้อ/i.test(r.product)).reduce((t, r) => t + qtyOf(r), 0);
    const total = countOf(view, rows);
    return {
      items: [['สั่งคู่กับเสื้อ', withShirt], ['หมวกอย่างเดียว', total - withShirt]],
      total: ['รวม (ใบ)', total],
    };
  }

  function render() {
    const d = state.data;
    const views = viewList(d);
    const view = currentView();
    state.view = view.key;
    // สคริปต์เวอร์ชันใหม่ส่งเลขออเดอร์ / จำนวนหมวกมาด้วย (เวอร์ชันเก่าไม่มี ก็ซ่อนคอลัมน์นั้น)
    const has = (list, key) => (list || []).some(r => r && Object.prototype.hasOwnProperty.call(r, key));
    state.withOrder = has(d.shirts.concat(d.caps, d.shipping || []), 'order');
    state.withQty = has(d.caps, 'qty');
    const rows = rowsOf(view, true);
    const shown = rows.filter(matches);

    $('switch').replaceChildren(...views.map(v => el('button', { type: 'button', 'data-view': v.key, 'aria-pressed': String(v.key === view.key) }, [
      el('span', { class: 'label' }, [v.swatch ? el('span', { class: 'swatch ' + v.swatch, 'aria-hidden': 'true' }) : null, v.label]),
      el('span', { class: 'num', text: String(countOf(v, rowsOf(v, true))) }),
    ])));
    $('q').placeholder = (view.kind === 'shirt' ? 'ชื่อหลังเสื้อ หรือเลข'
      : view.kind === 'ship' ? 'ชื่อ เบอร์ ที่อยู่ หรือเลขพัสดุ'
      : 'ชื่อ เบอร์ IG หรือห้อง') + (state.withOrder ? ' หรือ #ออเดอร์' : '');
    $('clear-dates').hidden = !state.from && !state.to;

    const exportBtn = $('export');
    exportBtn.textContent = 'ดาวน์โหลด Excel (' + countOf(view, rows) + ' ' + UNIT[view.kind] + ')';
    exportBtn.disabled = rows.length === 0;

    const s = summary(rows, view);
    $('run').replaceChildren(...s.items.map(([k, v]) => runItem(k, v)), runItem(s.total[0], s.total[1], 'total'));

    $('thead').closest('table').className = view.kind;
    $('thead').replaceChildren(el('tr', null, columnsFor(view.kind).map(label => el('th', { scope: 'col', text: label }))));
    const make = view.kind === 'shirt' ? shirtRow : view.kind === 'ship' ? shipRow : capRow;
    $('tbody').replaceChildren(...shown.map(make));

    const empty = shown.length === 0;
    $('empty').hidden = !empty;
    if (empty) {
      const hasRange = state.from || state.to;
      $('empty-text').textContent = state.q
        ? 'ไม่พบ "' + state.q + '" ในรายการนี้'
        : hasRange ? 'ไม่มีออเดอร์ในช่วงวันที่นี้'
        : view.kind === 'ship' ? 'ยังไม่มีออเดอร์ที่ต้องจัดส่ง' : 'ยังไม่มีออเดอร์ที่สลิปผ่าน';
      $('empty-reset').hidden = !hasRange || !!state.q;
    }

    $('subtitle').textContent = d.demo ? 'ตัวอย่างข้อมูลสมมติ' : (d.onlyVerified ? 'รายการที่สลิปผ่านแล้ว' : 'ทุกรายการ');
    $('updated').textContent = 'อัปเดตล่าสุด ' + timeFmt.format(new Date(d.updatedAt));
    const link = safeLink(d.sheetUrl);
    $('sheet-link').hidden = !link;
    if (link) $('sheet-link').href = link;
  }

  // ---------- Excel ----------
  function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = XLSX_SRC;
      s.onload = () => resolve(window.XLSX);
      s.onerror = () => reject(new Error('โหลดตัวสร้างไฟล์ Excel ไม่ได้ ลองใหม่อีกครั้ง'));
      document.head.append(s);
    });
  }

  async function exportExcel() {
    const btn = $('export');
    const label = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'กำลังสร้างไฟล์…';
    try {
      const XLSX = await loadXLSX();
      const view = currentView();
      const rows = rowsOf(view, true);
      const when = r => { const t = toDate(r.time); return t ? fullFmt.format(t).replace(',', '') : ''; };
      let header, body, widths, sheetName;
      sheetName = view.label.slice(0, 31);
      const withOrder = state.withOrder;
      const order = r => (withOrder ? [r.order || 'เพิ่มเอง'] : []);
      const orderHead = withOrder ? ['ออเดอร์'] : [];
      const orderWidth = withOrder ? [10] : [];
      // ช่องที่มีหลายบรรทัด (รายการ ผู้สั่ง) ต่อกันด้วย " / " จะได้อ่านง่ายใน Excel
      const oneLine = v => String(v || '').split('\n').map(x => x.trim()).filter(Boolean).join(' / ');
      const qtyHead = state.withQty ? ['จำนวน (ใบ)'] : [];
      if (view.kind === 'shirt') {
        header = ['ลำดับ', 'Size', 'ชื่อหลังเสื้อ', 'เลขหลังเสื้อ'].concat(orderHead, ['วันที่สั่ง', 'ลิงก์สลิป']);
        body = rows.map((r, i) => [i + 1, r.size, r.name, String(r.number || '')].concat(order(r), [when(r), safeLink(r.slip)]));
        widths = [7, 8, 18, 12].concat(orderWidth, [18, 45]);
      } else if (view.kind === 'ship') {
        header = ['ลำดับ', 'ชื่อผู้รับ', 'เบอร์โทร', 'ที่อยู่', 'รายการ', 'ผู้สั่ง', 'ติดต่อผู้สั่ง'].concat(orderHead, ['สถานะ', 'เลขพัสดุ', 'วันที่สั่ง', 'ลิงก์สลิป']);
        body = rows.map((r, i) => [i + 1, r.name, String(r.phone || ''), oneLine(r.address), oneLine(r.items), oneLine(r.buyer), oneLine(r.contact)]
          .concat(order(r), [r.shipped ? 'ส่งแล้ว' : 'รอส่ง', String(r.tracking || ''), when(r), safeLink(r.slip)]));
        widths = [7, 22, 14, 50, 45, 26, 22].concat(orderWidth, [9, 18, 18, 45]);
      } else {
        header = ['ลำดับ', 'ชื่อ', 'ชั้น', 'ห้อง', 'เบอร์ติดต่อ', 'IG / Line', 'สินค้าที่สั่ง'].concat(qtyHead, orderHead, ['วันที่สั่ง', 'ลิงก์สลิป']);
        body = rows.map((r, i) => [i + 1, r.name, r.grade, String(r.room || ''), String(r.phone || ''), r.social, r.product]
          .concat(state.withQty ? [qtyOf(r)] : [], order(r), [when(r), safeLink(r.slip)]));
        widths = [7, 26, 10, 6, 14, 20, 26].concat(state.withQty ? [10] : [], orderWidth, [18, 45]);
      }
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet([header].concat(body));
      ws['!cols'] = widths.map(w => ({ wch: w }));
      XLSX.utils.book_append_sheet(wb, ws, sheetName);

      const s = summary(rows, view);
      const sum = XLSX.utils.aoa_to_sheet([[view.kind === 'shirt' ? 'Size' : view.kind === 'ship' ? 'สถานะ' : 'รายการ', 'จำนวน']].concat(s.items, [s.total]));
      sum['!cols'] = [{ wch: 16 }, { wch: 10 }];
      XLSX.utils.book_append_sheet(wb, sum, 'สรุป');

      const range = state.from || state.to ? (state.from || 'เริ่ม') + '_ถึง_' + (state.to || 'ล่าสุด') : 'ทั้งหมด';
      XLSX.writeFile(wb, 'RCWD-' + sheetName + '-' + range + '.xlsx');
    } catch (e) {
      alert(e.message || 'สร้างไฟล์ไม่สำเร็จ');
    } finally {
      btn.textContent = label;
      btn.disabled = false;
      render();
    }
  }

  // ---------- auth ----------
  function saved() {
    try { return JSON.parse(sessionStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { return null; }
  }
  function remember(auth) {
    try { auth ? sessionStorage.setItem(AUTH_KEY, JSON.stringify(auth)) : sessionStorage.removeItem(AUTH_KEY); } catch (e) { /* private mode */ }
  }

  async function load(auth) {
    state.data = await fetchData(auth.username, auth.password);
    state.auth = auth;
    remember(auth);
    show('app');
    render();
  }

  function showLogin(message, setup) {
    remember(null);
    state.auth = null;
    $('login-error').textContent = message || '';
    $('setup-note').hidden = !setup && !!API_URL;
    show('login');
  }

  $('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    const user = f.querySelector('[name="username"]');
    const pass = f.querySelector('[name="password"]');
    const btn = f.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = 'กำลังเข้าสู่ระบบ…';
    $('login-error').textContent = '';
    try {
      await load({ username: user.value.trim(), password: pass.value });
      pass.value = '';
    } catch (err) {
      $('login-error').textContent = err.message;
      $('setup-note').hidden = !err.setup && !!API_URL;
    } finally {
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
    }
  });

  $('logout').addEventListener('click', () => showLogin(''));

  $('refresh').addEventListener('click', async () => {
    const b = $('refresh');
    b.disabled = true;
    b.textContent = 'กำลังดึงข้อมูล…';
    try {
      await load(state.auth || {});
    } catch (err) {
      if (err.auth) showLogin(err.message); else alert(err.message);
    } finally {
      b.disabled = false;
      b.textContent = 'ดึงข้อมูลล่าสุด';
    }
  });

  // ---------- controls ----------
  $('switch').addEventListener('click', e => {
    const b = e.target.closest('button[data-view]');
    if (!b) return;
    state.view = b.dataset.view;
    render();
  });
  $('from').addEventListener('change', e => { state.from = e.target.value; render(); });
  $('to').addEventListener('change', e => { state.to = e.target.value; render(); });
  $('q').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
  const clearDates = () => { state.from = state.to = ''; $('from').value = $('to').value = ''; render(); };
  $('clear-dates').addEventListener('click', clearDates);
  $('empty-reset').addEventListener('click', clearDates);
  $('export').addEventListener('click', exportExcel);

  // ---------- start ----------
  (async () => {
    const auth = DEMO ? {} : saved();
    if (!auth) return showLogin('', !API_URL);
    try {
      await load(auth);
    } catch (err) {
      showLogin(err.auth || err.setup ? err.message : '', err.setup);
    }
  })();
})();
</script>
</body>
</html>
